:root{--ink:#1f2a44;--red:#ef4444;--green:#22c55e;--mc:#7c3aed}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:Nunito,system-ui,sans-serif;color:var(--ink);touch-action:manipulation}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(#bfe6ff,#eaf7ff 62%,#d9f7b0)}
#app{width:1180px;height:820px;position:relative;flex:none;transform-origin:center center}
.screen{position:absolute;inset:0;display:none}.screen.on{display:block}
.fred,h1,h2,h3,button{font-family:Fredoka,Nunito,sans-serif}
button{border:none;cursor:pointer;color:inherit;background:none;padding:0}
.cloud{position:absolute;background:#fff;border-radius:60px;opacity:.85}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud:before{width:60%;height:140%;left:15%;top:-60%}.cloud:after{width:40%;height:110%;right:10%;top:-40%}

/* START */
#start{text-align:center}
#start .logo{margin-top:70px;font-family:Fredoka;font-weight:600;font-size:22px;letter-spacing:2px;color:#0f766e;text-transform:uppercase}
#start h1{font-size:92px;margin:6px 0 0;line-height:1;color:#1e3a8a;text-shadow:0 5px 0 #fff,0 9px 0 rgba(30,58,138,.18)}
#start h1 span{color:#f97316}
#start .sub{font-family:Fredoka;font-size:34px;color:#334155;margin-top:14px}
#start .chips{display:flex;gap:16px;justify-content:center;margin-top:30px}
.chip{background:#fff;border-radius:999px;padding:12px 24px;font-family:Fredoka;font-size:22px;font-weight:500;box-shadow:0 4px 0 rgba(0,0,0,.08)}
#startBtn{margin-top:46px;font-size:46px;font-weight:600;color:#fff;background:#22c55e;padding:22px 80px;border-radius:999px;box-shadow:0 9px 0 #15803d;animation:pulse 1.6s infinite}
#startBtn:active{transform:translateY(6px);box-shadow:0 3px 0 #15803d}
@keyframes pulse{50%{transform:scale(1.05)}}
#start .dino{position:absolute;left:60px;bottom:30px;width:210px}
#start .bfly{position:absolute;right:90px;top:200px;width:130px;animation:flut 2.4s ease-in-out infinite}
#start .ball{position:absolute;right:90px;bottom:60px;width:120px;animation:bounce 1.2s ease-in infinite alternate}
@keyframes flut{0%,100%{transform:translate(0,0) rotate(-6deg)}50%{transform:translate(-30px,-24px) rotate(8deg)}}
@keyframes bounce{from{transform:translateY(-90px)}to{transform:translateY(0)}}

/* HUB */
#hub h2{text-align:center;font-size:52px;margin:30px 0 0;color:#1e3a8a}
#hub .hsub{text-align:center;font-family:Fredoka;font-size:24px;color:#475569;margin-top:4px}
.cards{display:flex;gap:26px;justify-content:center;margin-top:30px}
.mcard{width:350px;background:#fff;border-radius:34px;padding:20px 22px 22px;box-shadow:0 10px 0 rgba(15,23,42,.08);border:5px solid var(--c);position:relative}
.mcard .wk{display:inline-block;background:var(--c);color:#fff;font-family:Fredoka;font-weight:600;font-size:20px;padding:5px 16px;border-radius:999px}
.mcard .art svg{max-height:165px;width:auto;max-width:100%}
.mcard .art{height:170px;display:flex;align-items:center;justify-content:center;margin:8px 0}
.mcard h3{margin:0;font-size:31px;text-align:center;line-height:1.1;min-height:68px;display:flex;align-items:center;justify-content:center}
.steps{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.stepbtn{display:flex;align-items:center;gap:12px;background:#f8fafc;border:3px solid #e2e8f0;border-radius:20px;padding:10px 14px;font-size:24px;font-weight:500;text-align:left}
.stepbtn .n{width:40px;height:40px;border-radius:50%;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600}
.stepbtn .lbl{flex:1}
.stepbtn .st{width:36px;height:36px}
.stepbtn:active{transform:scale(.97)}
.badge{position:absolute;top:-22px;right:-18px;width:84px;height:84px;display:none;animation:pop .5s}
.mcard.done .badge{display:block}
#hub .dino{position:absolute;left:24px;top:14px;width:110px}
#hub .bubble{position:absolute;left:138px;top:30px;max-width:185px;font-size:19px!important;background:#fff;border-radius:22px;padding:12px 20px;font-family:Fredoka;font-size:22px;box-shadow:0 4px 0 rgba(0,0,0,.08)}
#hub .bubble:before{content:"";position:absolute;left:-14px;top:18px;border:10px solid transparent;border-right:16px solid #fff}
#resetBtn{position:absolute;right:16px;bottom:12px;font-size:15px;background:rgba(255,255,255,.7);padding:8px 14px;border-radius:12px;color:#64748b}
#hub .brand{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-family:Fredoka;color:#0f766e;font-size:17px;letter-spacing:1.5px}

/* STAGE */
#stage header{position:absolute;left:14px;right:14px;top:10px;height:70px;display:flex;align-items:center;gap:14px;background:#fff;border-radius:24px;box-shadow:0 5px 0 rgba(15,23,42,.07);padding:0 14px}
.iconbtn{width:56px;height:56px;border-radius:50%;background:#eef2ff;display:flex;align-items:center;justify-content:center;flex:none}
.iconbtn svg{width:32px;height:32px}
.stitle{font-family:Fredoka;font-weight:600;font-size:27px;flex:1;white-space:nowrap}
.stitle small{display:inline-block;background:var(--mc);color:#fff;font-size:17px;padding:3px 12px;border-radius:999px;margin-right:10px;vertical-align:4px}
.tabs{display:flex;gap:8px}
.tabs button{padding:10px 18px;border-radius:16px;font-size:20px;font-weight:500;background:#f1f5f9}
.tabs button.on{background:var(--mc);color:#fff}
.dots{display:flex;gap:6px;min-width:60px;justify-content:flex-end}
.dots span{width:15px;height:15px;border-radius:50%;background:#e2e8f0}
.dots span.on{background:#22c55e}.dots span.cur{background:#facc15}
#prompt{position:absolute;left:14px;right:14px;top:90px;height:70px;background:#fffbea;border:3px solid #fde68a;border-radius:22px;display:flex;align-items:center;gap:14px;padding:0 10px 0 6px}
#prompt .pd{width:62px;height:62px;flex:none}
#ptext{font-family:Fredoka;font-size:28px;font-weight:500;flex:1;line-height:1.1}
#ptext b{color:var(--mc)}
#body{position:absolute;left:14px;right:14px;top:170px;bottom:12px}
.center{display:flex;align-items:center;justify-content:center}
.col{display:flex;flex-direction:column;align-items:center}

/* common buttons */
.bigbtn{font-size:34px;font-weight:600;color:#fff;background:#22c55e;padding:16px 40px;border-radius:999px;box-shadow:0 7px 0 #15803d;display:inline-flex;align-items:center;gap:12px}
.bigbtn:active{transform:translateY(5px);box-shadow:0 2px 0 #15803d}
.bigbtn.red{background:#ef4444;box-shadow:0 7px 0 #b91c1c}
.bigbtn.green{background:#22c55e}
.bigbtn.blue{background:#3b82f6;box-shadow:0 7px 0 #1d4ed8}
.bigbtn.gray{background:#94a3b8;box-shadow:0 7px 0 #64748b}
.bigbtn.purple{background:#8b5cf6;box-shadow:0 7px 0 #6d28d9}
.choices{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.cbtn{min-width:96px;height:96px;padding:0 18px;border-radius:26px;background:#fff;border:5px solid #c7d2fe;font-size:52px;font-weight:600;box-shadow:0 6px 0 #a5b4fc}
.cbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #a5b4fc}
.cbtn.right{background:#bbf7d0;border-color:#22c55e;box-shadow:0 6px 0 #16a34a;animation:pop .4s}
.cbtn.wrong{background:#fee2e2;border-color:#fca5a5;box-shadow:none;opacity:.55;animation:shake .4s}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.shake{animation:shake .4s}
.popin{animation:pop .45s}

/* butterflies (learn) */
.addrow{display:flex;align-items:center;justify-content:center;gap:20px;margin-top:10px}
.grp{min-width:250px;min-height:250px;max-width:430px;background:#fff;border-radius:30px;border:5px dashed #cbd5e1;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:6px;padding:14px}
.grp .zero{font-family:Fredoka;font-size:30px;color:#94a3b8}
.bf{width:96px;height:80px;position:relative;cursor:pointer}
.bf svg{width:100%;height:100%;transition:transform .2s}
.bf.counted svg{transform:scale(.9);filter:saturate(1.3)}
.bf .bdg{position:absolute;right:-4px;top:-8px;width:40px;height:40px;border-radius:50%;background:#1e3a8a;color:#fff;font-family:Fredoka;font-weight:600;font-size:24px;display:none;align-items:center;justify-content:center;border:3px solid #fff}
.bf.counted .bdg{display:flex;animation:pop .35s}
.op{font-family:Fredoka;font-size:80px;font-weight:600;color:#475569}

@keyframes fall{to{transform:translateY(900px) rotate(720deg)}}
</style>

function openModal(html,closable=true,onClose){const md=$('#modal');md.innerHTML=`<div class="mbox">${closable?`<button class="iconbtn mclose">${ICON.x}</button>`:''}${html}</div>`;md.classList.add('on');if(closable)$('.mclose',md).onclick=()=>{sfx.tap();closeModal();onClose&&onClose()};return $('.mbox',md)}

/* askNumber: resolves with number of wrong tries, or null if closed */
function askNumber({title,html='',answer,mode='pad',choices,hint='',speak,closable=true}){
 return new Promise(res=>{
  const box=openModal(`<div class="mtitle fred">${title}</div><div class="mbody">${html}</div><div class="hint" style="display:none">${hint}</div><div class="mans"></div>`,closable,()=>res(null));
  let wrong=0;if(speak)say(speak);
  const ans=$('.mans',box);
  const fail=()=>{wrong++;sfx.no();say(pick(TRY));if(wrong>=2&&hint){const h=$('.hint',box);if(h.style.display!=='block'){h.style.display='block';h.classList.add('popin')}}};
  const win=()=>{sfx.ok();setTimeout(()=>{closeModal();res(wrong)},450)};
  if(mode==='choices'){
   ans.innerHTML=`<div class="choices">${choices.map(c=>`<button class="cbtn" data-v="${c}">${c}</button>`).join('')}</div>`;
   $$('.cbtn',ans).forEach(b=>b.onclick=()=>{if(+b.dataset.v===answer){b.classList.add('right');win()}else{b.classList.add('wrong');b.disabled=true;fail()}});
  }else{
   let v='';
   ans.innerHTML=`<div class="padv">&nbsp;</div><div class="pad">${[1,2,3,4,5,0,6,7,8,9].map(n=>`<button class="pk" data-k="${n}">${n}</button>`).join('')}<button class="pk del" data-k="del">${ICON.del}</button><button class="pk ok" data-k="ok">${ICON.check}</button></div>`;
   // reorder: put 0 at the end of row 2 for natural layout
   const pad=$('.pad',ans);const keys=$$('.pk',pad);const order=['1','2','3','4','5','del','6','7','8','9','0','ok'];pad.innerHTML='';order.forEach(k=>pad.appendChild(keys.find(e=>e.dataset.k===k)));
   const disp=$('.padv',ans);const upd=()=>disp.innerHTML=v||'&nbsp;';
   $$('.pk',ans).forEach(b=>b.onclick=()=>{const k=b.dataset.k;sfx.tap();
    if(k==='del'){v=v.slice(0,-1);upd();return}
    if(k==='ok'){if(v==='')return;if(+v===answer){disp.style.borderColor='#22c55e';disp.style.background='#dcfce7';win()}else{disp.classList.remove('shake');void disp.offsetWidth;disp.classList.add('shake');v='';setTimeout(upd,300);fail()}return}
    if(v.length<3){v=(v==='0'?'':v)+k;upd()}});
  }
 });
}
/* inline choices in a container — resolves when correct */
function inlineChoices(el,choices,answer,onWrong){return new Promise(res=>{el.innerHTML=`<div class="choices">${choices.map(c=>`<button class="cbtn" data-v="${c}">${c}</button>`).join('')}</div>`;
 $$('.cbtn',el).forEach(b=>b.onclick=()=>{if(+b.dataset.v===answer){b.classList.add('right');sfx.ok();$$('.cbtn',el).forEach(x=>x.disabled=true);res()}else{b.classList.add('wrong');b.disabled=true;sfx.no();onWrong?onWrong():say(pick(TRY))}})})}
function choiceSet(ans,min,max,n=3,step=1){const s=new Set([ans]);let guard=0;while(s.size<n&&guard++<200){const d=(Math.floor(Math.random()*3)+1)*step*(Math.random()<.5?-1:1);const c=ans+d;if(c>=min&&c<=max)s.add(c)}for(let c=min;s.size<n&&c<=max;c+=step)s.add(c);return shuffle([...s])}

 setPrompt('<b>100!</b> Ten tens make one hundred!',false);sfx.win();await say('One hundred! Ten tens make one hundred!');
 if(!live())return;setDots(1,3);
 $('#ctl').innerHTML=`<button class="bigbtn blue" id="again">Count with me</button><button class="bigbtn" id="nx">Next</button>`;
 setPrompt('Count by 10s with me!',false);
 const countAlong=async()=>{const tl=$$('#tl .tile');for(let i=0;i<10;i++){if(!live())return;tl.forEach(t=>t.classList.remove('hl'));tl[i].classList.add('hl');sfx.count(i);await say(String(TENS[i]))}tl.forEach(t=>t.classList.remove('hl'))};
 await countAlong();if(!live())return;
 await new Promise(res=>{$('#again').onclick=()=>countAlong();$('#nx').onclick=()=>{sfx.tap();res()}});
 if(!live())return;setDots(2,3);
 for(const n of [29,15]){
  if(!live())return;const t=Math.floor(n/10),o=n%10;
  $('#body').innerHTML=`<div class="center" style="gap:60px;margin-top:10px"><div class="bignum">${n}</div><div class="panel">${blocksHTML(n,{c:22,id:'bk'})}</div></div>
   <div class="sentence" id="sen" style="margin-top:34px;font-size:60px">${n} = <span class="t" id="sT">__</span> ${plural(t,'ten')} + <span class="o" id="sO">__</span> ${plural(o,'one')}</div>`;
  setPrompt(`Tap each <b style="color:#dc2626">ten</b> to count the tens.`,true,`This is ${n}. Tap each red ten to count the tens.`);
  let c=0;await new Promise(res=>{$$('#bk .rod').forEach(r=>r.onclick=()=>{if(r.classList.contains('hl'))return;c++;r.classList.add('hl');sfx.count(c);say(`${c} ${plural(c,'ten')}`);if(c===t)setTimeout(res,900)})});
  if(!live())return;$('#sT').textContent=t;$('#sT').classList.add('popin');
  setPrompt(`Now tap each <b style="color:#16a34a">one</b>.`);
  c=0;await new Promise(res=>{$$('#bk .cube').forEach(r=>r.onclick=()=>{if(r.classList.contains('hl'))return;c++;r.classList.add('hl');sfx.count(c);say(String(c));if(c===o)setTimeout(res,700)})});
  if(!live())return;$('#sO').textContent=o;$('#sO').classList.add('popin');
  setPrompt(`${n} = <b>${t} ${plural(t,'ten')}</b> + <b>${o} ${plural(o,'one')}</b>`,false);
  await say(`${n} equals ${t} ${plural(t,'ten')} plus ${o} ${plural(o,'one')}! ${pick(PRAISE)}`);await wait(600);
 }
 if(live()){setDots(3,3);finishStep('You can count by 10s and find tens and ones!')}
}

async function m3Play(){
 const live=token();const MISS=[[20,50,80],[30,40,70,90],[20,40,60,70,90]];const BUILD=[18,26,32,15,41];const TOT=MISS.length+BUILD.length;
 for(let r=0;r<MISS.length;r++){
  if(!live())return;setDots(r,TOT);const bl=new Set(MISS[r]);
  $('#body').innerHTML=`<div style="margin-top:30px">${tilesHTML(TENS,bl)}</div><div class="center" style="margin-top:40px;gap:30px"><div class="fred" style="font-size:36px;font-weight:600" id="qq"></div></div><div id="ch" style="margin-top:20px"></div><div id="hn" class="center" style="margin-top:16px"></div>`;
  setPrompt('Count by 10s. Find the <b>missing numbers</b>!');
  for(const v of MISS[r]){
   if(!live())return;const tile=$(`#body .tile[data-v="${v}"]`);tile.classList.add('sel');
   const prev=v-10;$('#qq').textContent=`What comes after ${prev}?`;say(`What comes after ${prev}?`);
   let w=0;await inlineChoices($('#ch'),choiceSet(v,10,100,3,10),v,()=>{say(pick(TRY));if(++w>=2)$('#hn').innerHTML=`<div class="hintbox fred" style="font-size:28px">Count: ${TENS.slice(0,TENS.indexOf(v)).join(', ')}, ...</div>`});
   if(!live())return;tile.textContent=v;tile.classList.remove('sel','blankt');tile.classList.add('new');$('#hn').innerHTML='';await say(String(v));
  }
  if(!live())return;$('#ch').innerHTML='';$('#qq').textContent='10, 20, 30 ... 100!';
  const tl=$$('#body .tile');for(let i=0;i<10;i++){if(!live())return;tl.forEach(t=>t.classList.remove('hl'));tl[i].classList.add('hl');await say(String(TENS[i]))}
  await wait(300);
 }
 for(let b=0;b<BUILD.length;b++){
  if(!live())return;setDots(MISS.length+b,TOT);const n=BUILD[b];const T=Math.floor(n/10),O=n%10;let t=0,o=0;
  $('#body').innerHTML=`<div class="center" style="gap:30px;align-items:center"><div class="col"><div class="fred" style="font-size:26px;font-weight:600">Build</div><div class="bignum">${n}</div></div>
   <div class="tray"><div class="blocks" style="--c:22px"><div class="tcol"><div class="bl tlbl">tens</div><div class="rods" id="rods"></div></div><div class="ocol"><div class="bl olbl">ones</div><div class="cubes" id="cubes"></div></div></div></div>
   <div class="col" style="gap:16px"><button class="bigbtn red" id="aT">+ 1 ten</button><button class="bigbtn green" id="aO">+ 1 one</button><button class="bigbtn gray" id="clr" style="font-size:24px;padding:10px 26px">Start over</button></div></div>
   <div class="sentence" id="have" style="margin-top:14px">I have: <span class="t">0 tens</span> + <span class="o">0 ones</span> = 0</div>
   <div class="center" style="gap:20px;margin-top:6px"><div class="fred" id="qq" style="font-size:34px;font-weight:600"></div><div id="ch"></div></div>`;
  setPrompt(`Build <b>${n}</b> with tens and ones!`);
  const upd=()=>{const v=t*10+o;$('#have').innerHTML=`I have: <span class="t">${t} ${plural(t,'ten')}</span> + <span class="o">${o} ${plural(o,'one')}</span> = ${v}`;$('#rods').innerHTML='<div class="rod"></div>'.repeat(t);$('#cubes').innerHTML='<div class="cube"></div>'.repeat(o)};
  await new Promise(res=>{
   const check=()=>{const v=t*10+o;if(v===n){$('#aT').disabled=$('#aO').disabled=$('#clr').disabled=true;res()}else if(v>n){say(`Oh no, that is more than ${n}. Start over!`)}};
   $('#aT').onclick=()=>{if(t>=9)return;t++;sfx.count(t);upd();say(`${t} ${plural(t,'ten')}`);check()};
   $('#aO').onclick=()=>{o++;if(o===10){o=0;t++;upd();say('10 ones make 1 ten!');sfx.boing()}else{sfx.count(o);upd();say(`${o} ${plural(o,'one')}`)}check()};
   $('#clr').onclick=()=>{t=0;o=0;sfx.tap();upd()};
  });
  if(!live())return;sfx.ok();await say(`You made ${n}!`);if(!live())return;
  $('#have').innerHTML=`${n} = <span class="t" id="sT">__</span> ${plural(T,'ten')} + <span class="o" id="sO">__</span> ${plural(O,'one')}`;
  setPrompt(`How many <b style="color:#dc2626">tens</b> in ${n}?`);$('#qq').textContent='Tens:';
  await inlineChoices($('#ch'),choiceSet(T,1,9),T);if(!live())return;$('#sT').textContent=T;
  setPrompt(`How many <b style="color:#16a34a">ones</b> in ${n}?`);$('#qq').textContent='Ones:';
  await inlineChoices($('#ch'),choiceSet(O,0,9),O);if(!live())return;$('#sO').textContent=O;$('#ch').innerHTML='';$('#qq').textContent='';
  await say(`${n} equals ${T} ${plural(T,'ten')} plus ${O} ${plural(O,'one')}! ${pick(PRAISE)}`);await wait(400);
 }
 if(live()){setDots(TOT,TOT);finishStep('You built every number!')}
}

async function m3Work(){
 const live=token();const bl=new Set([20,40,50,70,80,90]);const EQ=[29,15,34,23];
 $('#body').innerHTML=`<div class="sheet"><div class="wtag">Week 4</div>
  <div class="instr">Count by 10s. Fill in the missing numbers. <button class="readbtn" id="rd1">${ICON.spk} Read</button></div>
  <div style="margin-top:8px">${tilesHTML(TENS,bl).replace('class="tiles"','class="tiles" id="wt"')}</div>
  <div class="instr" style="margin-top:20px">Point out the number in the tens place and the ones place. Write. <button class="readbtn" id="rd2">${ICON.spk} Read</button></div>
  <div class="wsq" style="opacity:.35;transition:opacity .4s" id="wq">${EQ.map((n,i)=>{const t=Math.floor(n/10),o=n%10;return `<div class="weq">${n} = <div class="blank" id="e${i}t"></div><span class="w">${plural(t,'ten')}</span> + <div class="blank" id="e${i}o"></div><span>${plural(o,'one')}</span></div>`}).join('')}</div></div>`;
 const I1='Count by 10s. Fill in the missing numbers.';const I2='Look at the number at the beginning. Point out the number that belongs in the tens place, and the number that belongs in the ones place. Write.';
 $('#rd1').onclick=()=>say(I1);$('#rd2').onclick=()=>say(I2);
 setPrompt('Count by 10s. Tap a box and fill in the missing numbers.',true,I1);setDots(0,2);
 const blanks=TENS.filter(v=>bl.has(v));
 const tiles=$$('#wt .tile');
 await new Promise(res=>{let left=blanks.length;tiles.forEach(tl=>{if(!tl.classList.contains('blankt'))return;tl.onclick=async()=>{if(!tl.classList.contains('blankt'))return;sfx.tap();tl.classList.add('sel');const v=+tl.dataset.v;
   const w=await askNumber({title:`${v-10}, <span class="q">?</span>`,answer:v,mode:'pad',speak:`What comes after ${v-10}?`,hint:`<div class="hintbox fred" style="font-size:28px">Count: ${TENS.slice(0,TENS.indexOf(v)).join(', ')}, ...</div>`});
   tl.classList.remove('sel');if(!live()||w===null)return;tl.textContent=v;tl.classList.remove('blankt');tl.classList.add('new');say(String(v));if(--left===0)setTimeout(res,700)}})});
 if(!live())return;setDots(1,2);$('#wq').style.opacity=1;
 setPrompt('Write the <b style="color:#dc2626">tens</b> and the <b style="color:#16a34a">ones</b>. Tap the boxes!',true,I2);
 const ids=[],ans=[],qs=[],hs=[];EQ.forEach((n,i)=>{const t=Math.floor(n/10),o=n%10;ids.push(`e${i}t`,`e${i}o`);ans.push(t,o);
  qs.push({title:`${n}: how many <span style="color:#dc2626">tens</span>?`,say:`${n}. How many tens?`},{title:`${n}: how many <span style="color:#16a34a">ones</span>?`,say:`${n}. How many ones?`});
  const h=`<div class="hintbox">${blocksHTML(n,{c:10})}</div>`;hs.push(h,h)});
 await storyBlanks({live,answers:ans,blankIds:ids,speakQ:qs,hints:hs,onDone:async()=>{setDots(2,2);await say(pick(PRAISE));if(live())finishStep('You finished the Counting by 10s worksheet by yourself!')}});
}
